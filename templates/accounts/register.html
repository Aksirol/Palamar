{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 mt-4 mb-5">
        <h3 class="text-center mb-4">Реєстрація</h3>
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-success w-100 mt-3">Зареєструватися</button>
        </form>
    </div>
</div>
{% endblock %}
