{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Вхід{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-4 mt-5">
        <h3 class="text-center mb-4">Вхід у систему</h3>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Увійти</button>
        </form>
        <div class="text-center mt-3">
            <a href="{% url 'register' %}">Ще не маєте акаунту? Реєстрація</a>
        </div>
    </div>
</div>
{% endblock %}
